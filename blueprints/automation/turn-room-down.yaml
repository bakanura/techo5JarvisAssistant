blueprint:
  name: Turn the room down while a Show listens
  description: >-
    While a voice assistant (a Jarvis Show, or any other) listens, thinks and answers, the speakers
    you pick are turned almost all the way down, so the music in the room doesn't end up in what it
    hears and you can hear the answer. They stay down for the whole conversation, follow-up
    questions included, and come back up once it has been quiet for a few seconds.

    A speaker that isn't playing is left alone. One stepped up or down during the turn ("lauter",
    "leiser") comes back to its old volume plus that step, and one set outright ("Lautstärke auf
    30", a slider) keeps what it was set to. The Show turns down what it plays itself, so don't pick
    its own speaker.
  domain: automation
  source_url: https://github.com/vardstein/techo5JarvisAssistant/blob/jarvis-crown-v1/blueprints/automation/turn-room-down.yaml
  input:
    satellite:
      name: Voice assistant
      selector:
        entity:
          filter:
            - domain: assist_satellite
    speakers:
      name: Speakers to turn down
      description: >-
        The room's speakers. When Music Assistant and the speaker's own integration both have an entity
        for the same speaker, pick only one, or it is turned down twice.
      selector:
        entity:
          multiple: true
          filter:
            - domain: media_player
    part:
      name: Turned down to
      description: >-
        How much of its volume a speaker keeps during the conversation. 10 % leaves the music just
        audible; 0 mutes it.
      default: 10
      selector:
        number:
          min: 0
          max: 90
          step: 5
          unit_of_measurement: "%"
    quiet:
      name: Back up after
      description: >-
        How long the assistant has to be idle first. Shorter than the pause before a follow-up,
        and the follow-up starts with the music up again.
      default: 3
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: s

# A turn that opens while the speakers are down is part of the same run.
mode: single
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input satellite
    from: idle
    to: listening

variables:
  satellite: !input satellite
  speakers: !input speakers
  part: !input part
  quiet: !input quiet
  was: >-
    {% set ns = namespace(out={}) %}
    {% for s in speakers if is_state(s, 'playing') and state_attr(s, 'volume_level') is number %}
      {% set ns.out = dict(ns.out, **{s: state_attr(s, 'volume_level')}) %}
    {% endfor %}
    {{ ns.out }}
  down: >-
    {% set ns = namespace(out={}) %}
    {% for s, v in was.items() %}
      {% set ns.out = dict(ns.out, **{s: (v * part / 100) | round(2)}) %}
    {% endfor %}
    {{ ns.out }}

conditions:
  - condition: template
    value_template: "{{ was | count > 0 }}"

actions:
  - repeat:
      for_each: "{{ down | list }}"
      sequence:
        - action: media_player.volume_set
          target:
            entity_id: "{{ repeat.item }}"
          data:
            volume_level: "{{ down[repeat.item] }}"
          continue_on_error: true
  # Until it has been idle for the whole of quiet. Each time round it works out from the state how
  # long that still is, so a turn that was over before this got here counts too, and starts again
  # whenever the assistant moves. Five minutes without it going idle is a stuck assistant, and the
  # music comes back up anyway.
  #
  # Meanwhile it notes the speakers somebody sets outright. "Lautstärke auf 30" and a slider both
  # call volume_set, which shows up as a call_service event; "lauter" and "leiser" step the speaker
  # directly and do not, so a speaker that moved without one was stepped.
  - variables:
      set_outright: []
  - repeat:
      sequence:
        - variables:
            idle_for: >-
              {{ (now() - states[satellite].last_changed).total_seconds()
                 if is_state(satellite, 'idle') else -1 }}
        - wait_for_trigger:
            - trigger: state
              entity_id: !input satellite
            - trigger: event
              event_type: call_service
              event_data:
                domain: media_player
                service: volume_set
          timeout:
            seconds: "{{ [quiet - idle_for, 0.1] | max if idle_for >= 0 else 300 }}"
        - if:
            - condition: template
              value_template: "{{ wait.trigger is not none and wait.trigger.event is defined }}"
          then:
            - variables:
                set_outright: >-
                  {% set e = wait.trigger.event.data.service_data.entity_id | default([]) %}
                  {% set e = [e] if e is string else e | list %}
                  {{ (set_outright + (e | select('in', was) | list)) | unique | list }}
      until:
        - condition: template
          value_template: "{{ wait.trigger is none or repeat.index > 100 }}"
  - repeat:
      for_each: "{{ was | list }}"
      sequence:
        - variables:
            moved: >-
              {{ state_attr(repeat.item, 'volume_level') | float(down[repeat.item]) - down[repeat.item] }}
        # Set outright, it stays. Otherwise back to where it was, plus whatever it was stepped by:
        # 0.62 turned down to 0.06 and stepped to 0.16 comes back at 0.72.
        - if:
            - condition: template
              value_template: "{{ repeat.item not in set_outright }}"
          then:
            - action: media_player.volume_set
              target:
                entity_id: "{{ repeat.item }}"
              data:
                volume_level: >-
                  {{ was[repeat.item] if moved | abs < 0.02
                     else ([[was[repeat.item] + moved, 0] | max, 1] | min) | round(2) }}
              continue_on_error: true
