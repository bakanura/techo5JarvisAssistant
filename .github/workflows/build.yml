name: Jarvis Show CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            go.sum
            echod/go.sum
            dashcast/go.sum
      - name: Python installer tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Go tests
        run: |
          go test ./...
          (cd echod && go test ./...)
          (cd dashcast && go test ./...)
      - name: Build Show daemon
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        working-directory: echod
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: '7'
          CGO_ENABLED: '0'
        run: |
          version="${GITHUB_REF_NAME:-v0.0.0-dev}"
          [[ "$version" == v* ]] || version=v0.0.0-dev
          commit=$(git rev-parse --short HEAD)
          date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          pkg=github.com/HuskerMinion/techo5/echod/internal/layout
          go build -trimpath -ldflags "-s -w -X $pkg.Version=$version -X $pkg.GitCommit=$commit -X $pkg.BuildDate=$date" -o ../bin/echod-arm ./cmd/echod
      - name: Attest Show daemon
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: bin/echod-arm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: jarvis-show-${{ github.ref_name }}
          path: bin/echod-arm
          if-no-files-found: error
