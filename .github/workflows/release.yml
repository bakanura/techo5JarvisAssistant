name: Publish Jarvis Show release

# Each of the dev, staging and stable branches is a release source: a push builds, signs and publishes a
# release on that branch's update channel. The version comes from the VERSION file (the next stable
# version): dev builds are vX.Y.Z-dev.N, staging builds vX.Y.Z-rc.N and stable vX.Y.Z, N being the run
# number, so dev < rc < stable for one VERSION. Promote by fast-forwarding dev -> staging -> stable.
on:
  push:
    branches: [dev, staging, stable]
    tags: ['v*.*.*']
    paths-ignore: ['docs/**', 'audit/**', '**.md']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (vX.Y.Z or prerelease)'
        required: true
        type: string
      notes:
        description: 'Release notes'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: jarvis-show-release-${{ github.ref_name || inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            go.sum
            echod/go.sum
      - name: Resolve release metadata
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_NOTES: ${{ inputs.notes }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          channel=
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ]; then
            channel="$GITHUB_REF_NAME"
            base=$(tr -d '[:space:]' < VERSION)
            [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION must be X.Y.Z, not '$base'" >&2; exit 1; }
            if gh release view "v$base" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "v$base is already released as stable, so builds of it would rank below it and reach no device. Bump VERSION." >&2
              exit 1
            fi
            n="$GITHUB_RUN_NUMBER"
            [ "$GITHUB_RUN_ATTEMPT" = 1 ] || n="$n.$GITHUB_RUN_ATTEMPT"
            case "$channel" in
              dev) version="v$base-dev.$n";;
              staging) version="v$base-rc.$n";;
              stable) version="v$base";;
            esac
            notes="Jarvis Show $version ($channel channel, $(git rev-parse --short HEAD))"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
            notes="Jarvis Show $version"
          else
            version="$INPUT_VERSION"
            notes="$INPUT_NOTES"
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]
          {
            echo "version=$version"
            echo "channel=$channel"
            printf 'notes<<EOF\n%s\nEOF\n' "$notes"
          } >> "$GITHUB_OUTPUT"
      - name: Security regression gate
        run: tools/security-regression.sh
      # The installer's anti-brick tests check real, pinned images; fetch them and verify their hashes.
      - name: Fetch pinned historical test fixtures
        run: python3 tools/fetch-test-fixtures.py
      - name: Test source before release
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          (cd echod && go test ./...)
      - name: Install rootfs build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support uidmap
          bash tools/linux/ci-rootfs-userns.sh
      - name: Fetch pinned public rootfs inputs
        run: |
          python3 tools/fetch-inputs.py --device show
          mkdir -p "$HOME/apk"
          cp inputs/apk.static "$HOME/apk/apk.static"
          chmod 755 "$HOME/apk/apk.static"
      - name: Build shared Jarvis Show rootfs
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p bin
          tools/linux/deploy-rootfs.sh --out "bin/jarvis-show-rootfs-$VERSION.tar.gz" --version "$VERSION"
      # deploy-rootfs.sh leaves the exact embedded daemon in bin/echod-arm.
      - name: Verify embedded daemon matches exported payload
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: tar -xOf "bin/jarvis-show-rootfs-$VERSION.tar.gz" ./usr/local/bin/techo5 | cmp - bin/echod-arm
      - name: Attest release payload provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            bin/echod-arm
            bin/jarvis-show-rootfs-${{ steps.meta.outputs.version }}.tar.gz
      - name: Write release signing seed
        env:
          SIGN_SEED: ${{ secrets.JARVIS_SHOW_SIGN_KEY }}
        run: |
          [ -n "$SIGN_SEED" ] || { echo 'JARVIS_SHOW_SIGN_KEY secret is not configured' >&2; exit 1; }
          umask 077
          printf '%s\n' "$SIGN_SEED" > "$RUNNER_TEMP/jarvis-show-release.seed"
      - name: Publish signed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          NOTES: ${{ steps.meta.outputs.notes }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          JARVIS_SHOW_RELEASE_REPO: bakanura/techo5JarvisAssistant
        run: |
          channel_args=()
          [ -z "$CHANNEL" ] || channel_args=(--channel "$CHANNEL")
          tools/release-jarvis-show.sh \
            --version "$VERSION" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            "${channel_args[@]}" \
            --binary bin/echod-arm \
            --rootfs "bin/jarvis-show-rootfs-$VERSION.tar.gz" \
            --sign-key "$RUNNER_TEMP/jarvis-show-release.seed" \
            --publish
